name: Windows 11 noninteractive installer lifecycle
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/windows11-lifecycle.yml', 'qa/test-lifecycle.ps1']
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: windows-11-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        edition: [Free, Premium]
    env:
      READ_QA_ALLOW_NO_AUDIO_DEVICE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Confirm actual Windows 11 and record architecture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/validation | Out-Null
          $os=Get-CimInstance Win32_OperatingSystem
          if ($os.Caption -notmatch 'Windows 11') { throw 'This is not a Windows 11 machine.' }
          [ordered]@{caption=$os.Caption;version=$os.Version;build=$os.BuildNumber;architecture=$env:PROCESSOR_ARCHITECTURE;test_scope='Existing x64 installer on Windows 11 ARM under emulation; not an Intel/AMD laptop or native ARM package.'} | ConvertTo-Json | Set-Content build/validation/os.json
      - name: Download exact published installer and verify bytes
        shell: pwsh
        run: |
          $edition='${{ matrix.edition }}'
          $expected=if ($edition -eq 'Free') {'023227d4d303b7dd7d51d9665371cec82cf844b3d7cb4a8c1468d465c19ce9f4'} else {'77ef1d2dc41640a05d9565c0877533424c31c27e8781e0bcdda57cff8316784e'}
          Invoke-WebRequest "https://github.com/Zorro0001/honakari-downloads/releases/download/v14.0.7/Honakari-$edition-Setup-v14.exe" -OutFile setup.exe
          $hash=(Get-FileHash setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $expected) { throw 'Installer bytes do not match the verified release.' }
          [ordered]@{sha256=$hash;signature=(Get-AuthenticodeSignature setup.exe).Status.ToString()} | ConvertTo-Json | Set-Content build/validation/download.json
      - name: Install, runtime startup, expired trial, reinstall and uninstall - no pointer input
        shell: pwsh
        run: ./qa/test-lifecycle.ps1 -Installer ./setup.exe -Edition '${{ matrix.edition }}' -ConfirmIsolatedTestMachine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows11-ARM-lifecycle-${{ matrix.edition }}
          path: build/validation/
          if-no-files-found: warn
